<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#ffffff"/>
<title>DAG Studio · Black Swan Causal Labs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js">
</script>
<!-- React + ReactDOM are UMD scripts (set window globals); the main app
     script below is type="module" so it can import the analytical engine
     from ./dag-engine.js. type="module" defers, but the UMD scripts above
     run synchronously and have already populated window.{React,ReactDOM}
     by the time the module evaluates. pptxgenjs is injected on first PPTX
     export (see ensurePptxGen) rather than loaded upfront. -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* ─── CSS Variables for Theming — Black Swan Causal Labs palette ─── */
:root{
  --bg-primary:#f0f1f4;--bg-secondary:#fff;--bg-tertiary:#f6f7f9;--bg-canvas:#eef0f3;
  --border-primary:#d8dbe1;--border-secondary:#e6e8ec;
  --text-primary:#1a1d24;--text-secondary:#555861;--text-muted:#626670;
  --accent:#3d7a7a;--accent-light:#eaf2f2;--accent-border:#b8d1d1;
  --accent-dark:#2a6363;--accent-hi:#8bbfbf;
  --ink:#050608;--ink-soft:#1a1d24;
  --success:#0da271;--success-bg:#edf6f2;--success-border:#b6d6c8;
  --danger:#b94a4a;--danger-bg:#f7eceb;--danger-border:#e0bfbd;
  --dot-color:#c8cdd4;
  --shadow-sm:0 2px 8px rgba(5,6,8,.05);--shadow-md:0 4px 16px rgba(5,6,8,.08);
  --glass-bg:rgba(255,255,255,.93);--glass-border:rgba(255,255,255,.6);
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
.dark{
  --bg-primary:#090c10;--bg-secondary:#12161c;--bg-tertiary:#0d1014;--bg-canvas:#050608;
  --border-primary:#232830;--border-secondary:#1a1e25;
  --text-primary:#eef0f3;--text-secondary:#c8cdd4;--text-muted:#7a8089;
  --accent:#5aadad;--accent-light:#18322f;--accent-border:#2a6363;
  --accent-dark:#3d7a7a;--accent-hi:#8bbfbf;
  --ink:#050608;--ink-soft:#12161c;
  --success:#3fb950;--success-bg:#122419;--success-border:#1f3d2c;
  --danger:#d96660;--danger-bg:#2d1717;--danger-border:#4a2424;
  --dot-color:#232830;
  --shadow-sm:0 2px 8px rgba(0,0,0,.4);--shadow-md:0 4px 16px rgba(0,0,0,.5);
  --glass-bg:rgba(18,22,28,.93);--glass-border:rgba(35,40,48,.6);
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}

.root{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg-primary);color:var(--text-primary)}
.nav{height:64px;background:var(--bg-secondary);border-bottom:1.5px solid var(--border-primary);display:flex;align-items:center;padding:0 18px;gap:0;flex-shrink:0;box-shadow:0 1px 0 var(--border-primary),0 4px 12px rgba(5,6,8,.04)}
.dark .nav{box-shadow:0 1px 0 var(--border-primary),0 4px 12px rgba(0,0,0,.2)}
.nav-brand{font-size:13px;font-weight:600;color:#fff;letter-spacing:.01em;margin-right:24px;background:var(--accent);padding:5px 14px;border-radius:999px;line-height:1.2}
.nav-tab{padding:0 16px;height:50px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted);font-family:var(--font-mono);letter-spacing:.08em;text-transform:lowercase;border-bottom:1.5px solid transparent;transition:color .15s,border-color .15s}
.nav-tabs{display:flex;align-items:center;min-width:0}
/* Scroll views are flex:1 children of the 100dvh column; min-height:0 lets them
   scroll internally instead of growing past the viewport (which on mobile left
   the top unreachable). overscroll-behavior keeps momentum from latching. */
.validation-container{min-height:0;overscroll-behavior:contain}
.nav-tab:hover{color:var(--text-primary)}
.nav-tab.on{color:var(--text-primary);border-bottom-color:var(--text-primary)}
.dark .nav-tab.on{border-bottom-color:var(--accent)}
.nav-proto{font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--bg-secondary);background:var(--ink-soft);border-radius:3px;padding:4px 10px;font-family:var(--font-mono);cursor:default;transition:background .2s}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}
.dark .nav-proto{background:var(--accent);color:var(--ink)}
.nav-proto::before{display:none}
.nav-proto:hover{background:var(--ink)}
.webmcp-agent-change{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;max-width:min(560px,calc(100% - 220px));padding:10px 14px;border:1px solid #e2a84f;border-radius:9px;background:#fff8e9;color:#5e4218;box-shadow:0 5px 18px rgba(123,80,12,.14);font-size:11px;font-weight:600}
.webmcp-agent-change::before{content:'✦';color:#d88710;font-size:16px}.webmcp-agent-change button{margin-left:auto;border:1px solid #d6a355;background:#fff;border-radius:6px;padding:5px 9px;color:#684719;font:600 10px var(--font-mono);cursor:pointer}.dark .webmcp-agent-change{background:#2a2112;color:#f6d8a6;border-color:#7b5724}
@media(max-width:720px){.webmcp-agent-change{top:70px;max-width:calc(100% - 28px);width:calc(100% - 28px)}}
.dark .nav-proto:hover{background:var(--accent-hi)}

/* ─── Top Stats Bar ─── */
.stats-item{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em}
.stats-item strong{color:var(--text-primary);font-weight:500}
.stats-item.accent{color:var(--accent)}
.stats-item.success{color:var(--success)}
.stats-item.danger{color:var(--danger)}
.stats-sep{width:1px;height:14px;background:var(--border-primary)}

/* ─── Mobile Stats Summary (in panel) ─── */
.mobile-stats{display:none;padding:12px 16px;background:var(--bg-primary);border-bottom:1px solid var(--border-secondary);gap:8px;flex-wrap:wrap}
@media(max-width:1024px){.mobile-stats{display:flex}}
.mobile-stat{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-muted);background:var(--bg-secondary);padding:4px 10px;border-radius:6px;border:1px solid var(--border-secondary)}
.mobile-stat strong{color:var(--text-primary);font-weight:600}
.mobile-stat.accent{color:var(--accent);border-color:var(--accent-border)}
.mobile-stat.success{color:var(--success);border-color:var(--success-border)}
.mobile-stat.danger{color:var(--danger);border-color:var(--danger-border)}

.theme-toggle{display:flex;align-items:center;width:56px;height:28px;padding:3px;border-radius:14px;cursor:pointer;transition:background .3s,border-color .3s;background:#fff;border:1px solid #e5e7eb;position:relative;flex-shrink:0}
.dark .theme-toggle{background:#1e2a40;border:1px solid #374151}
.theme-toggle-thumb{position:absolute;display:flex;justify-content:center;align-items:center;width:22px;height:22px;border-radius:50%;transition:left .3s cubic-bezier(.4,0,.2,1);background:#e5e7eb;left:31px;z-index:2}
.dark .theme-toggle-thumb{background:#374151;left:3px}
.theme-toggle-icon{width:14px;height:14px}
.theme-toggle-icons{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 6px}
.theme-toggle-icon-wrap{display:flex;align-items:center;justify-content:center;width:16px;height:16px}

.studio{flex:1;display:flex;overflow:hidden}
.tb{width:54px;background:var(--bg-secondary);border-right:1.5px solid var(--border-primary);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px;flex-shrink:0;box-shadow:2px 0 10px rgba(5,6,8,.06)}
.dark .tb{box-shadow:2px 0 10px rgba(0,0,0,.2)}
.tb-btn{width:38px;height:38px;border-radius:9px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;background:transparent;color:var(--text-muted)}
.tb-btn svg{width:20px;height:20px}
.tb-btn:hover{background:var(--accent-light);color:var(--accent)}
.tb-btn.on{background:var(--accent-light);color:var(--accent);box-shadow:0 0 0 1.5px var(--accent-border) inset}
.tb-btn.era{background:var(--danger-bg);color:var(--danger);box-shadow:0 0 0 1.5px var(--danger-border) inset}
.tb-sep{width:22px;height:1px;background:var(--border-secondary);margin:6px 0}
.cv{flex:1;position:relative;overflow:hidden}
.cv.dragging,.cv.dragging *{cursor:grabbing!important}
.sb{position:absolute;bottom:0;left:0;right:0;height:32px;padding:0 16px;background:var(--glass-bg);backdrop-filter:blur(10px);border-top:1.5px solid var(--border-primary);display:flex;align-items:center;gap:16px;font-size:11px}
.sb-dim{color:var(--text-muted)}.sb-info{color:var(--accent);font-weight:500}
.sb-console-toggle{margin-left:auto;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);background:transparent;border:1px solid var(--border-primary);border-radius:5px;padding:3px 10px;cursor:pointer;transition:all .12s}
.sb-console-toggle:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-light)}
.pn{width:296px;background:var(--bg-tertiary);border-left:1.5px solid var(--border-primary);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;box-shadow:-2px 0 10px rgba(5,6,8,.06)}
.dark .pn{box-shadow:-2px 0 10px rgba(0,0,0,.2)}
.pn-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}

/* ─── Code Console (below canvas) ─── */
.main-col{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.cn{flex:0 0 260px;background:var(--bg-secondary);border-top:1.5px solid var(--border-primary);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -2px 10px rgba(5,6,8,.04)}
.dark .cn{box-shadow:0 -2px 10px rgba(0,0,0,.2)}
.cn.collapsed{display:none}
.cn-header{height:36px;flex-shrink:0;display:flex;align-items:center;padding:0 10px 0 14px;gap:8px;border-bottom:1px solid var(--border-secondary);background:var(--bg-secondary);user-select:none}
.cn.collapsed .cn-header{border-bottom:none}
.cn-title{font-size:10px;font-family:var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);font-weight:500;margin-right:4px}
.cn-tabs{display:flex;gap:2px}
.cn-tab{padding:3px 10px;font-size:10px;font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase;background:transparent;border:none;border-radius:5px;cursor:pointer;color:var(--text-muted);font-weight:500;transition:all .12s}
.cn-tab:hover{color:var(--text-primary);background:var(--bg-tertiary)}
.cn-tab.on{color:var(--accent);background:var(--accent-light)}
/* AI DAG Assistant tab: gradient label + sparkles — calm at rest, lively on hover */
.cn-tab.ai-tab{position:relative;overflow:visible;display:inline-flex;align-items:center;gap:5px;font-weight:700}
.cn-tab.ai-tab .ai-label{background:linear-gradient(90deg,#3b82f6,#6366f1,#8b5cf6,#3b82f6);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.cn-tab.ai-tab:hover{background:transparent}
.cn-tab.ai-tab:hover .ai-label{animation:aiGradient 2.6s linear infinite}
.cn-tab.ai-tab .ai-spark-lead{flex:none;fill:#8b5cf6;animation:aiTwinkleSoft 3s ease-in-out infinite}
.cn-tab.ai-tab .ai-spark{position:absolute;opacity:0;pointer-events:none;transform-origin:center}
.cn-tab.ai-tab:hover .ai-spark{animation:aiTwinkle 1.4s ease-in-out infinite}
@keyframes aiGradient{from{background-position:0% 50%}to{background-position:220% 50%}}
@keyframes aiTwinkle{0%,100%{opacity:0;transform:scale(.3) rotate(-12deg)}50%{opacity:1;transform:scale(1) rotate(20deg)}}
@keyframes aiTwinkleSoft{0%,100%{opacity:.6;transform:scale(.82)}50%{opacity:1;transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){.cn-tab.ai-tab .ai-label,.cn-tab.ai-tab .ai-spark,.cn-tab.ai-tab .ai-spark-lead{animation:none}.cn-tab.ai-tab .ai-spark{opacity:0}}
.cn-status{font-size:9.5px;font-family:var(--font-mono);letter-spacing:.04em;color:var(--text-muted);margin-left:4px}
.cn-status.ready{color:var(--success)}
.cn-status.loading{color:var(--accent)}
.cn-status.err{color:var(--danger)}
.cn-spacer{flex:1}
.cn-btn{padding:5px 11px;font-size:10px;font-family:var(--font-mono);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--border-primary);border-radius:6px;background:var(--bg-secondary);color:var(--text-primary);cursor:pointer;font-weight:500;transition:all .12s}
.cn-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.cn-btn.primary{background:var(--ink-soft);color:var(--bg-secondary);border-color:var(--ink-soft)}
.dark .cn-btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.cn-btn.primary:hover{background:var(--ink);color:var(--bg-secondary);border-color:var(--ink)}
.dark .cn-btn.primary:hover{background:var(--accent-hi);color:var(--ink);border-color:var(--accent-hi)}
/* Pulsating glow to draw the eye to the primary run button; calms on hover / while running */
.cn-btn.primary:not(:disabled){animation:runGlow 2.4s ease-in-out infinite}
@keyframes runGlow{0%,100%{box-shadow:0 0 5px 0 rgba(99,102,241,.35)}50%{box-shadow:0 0 0 3px rgba(99,102,241,.14),0 0 16px 3px rgba(99,102,241,.6)}}
.cn-btn.primary:hover{animation:none}
@media (prefers-reduced-motion: reduce){.cn-btn.primary:not(:disabled){animation:none}}
.cn-btn:disabled{opacity:.55;cursor:wait}
.cn-icon-btn{width:26px;height:26px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:5px;display:flex;align-items:center;justify-content:center;transition:all .12s;font-size:14px}
.cn-icon-btn:hover{color:var(--text-primary);background:var(--bg-tertiary)}
.cn-body{flex:1;display:flex;min-height:0}
.cn-editor{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border-secondary)}
.cn-editor textarea{flex:1;width:100%;padding:12px 14px;border:none;outline:none;resize:none;font-family:var(--font-mono);font-size:12px;line-height:1.55;background:var(--bg-tertiary);color:var(--text-primary);tab-size:4}
.cn-output{flex:0 0 320px;display:flex;flex-direction:column;background:var(--bg-canvas);overflow:hidden}
.cn-output-title{font-size:9px;font-family:var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);padding:8px 12px 4px;font-weight:500}
.cn-output-body{flex:1;overflow-y:auto;padding:2px 12px 10px;font-family:var(--font-mono);font-size:11px;line-height:1.55;color:var(--text-secondary);white-space:pre-wrap;word-break:break-word}
.cn-output-body.err{color:var(--danger)}
.cn-output-body.muted{color:var(--text-muted);font-style:italic}
.ps{padding:14px 16px;border-bottom:1px solid var(--border-secondary)}
.pt{font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;font-family:var(--font-mono)}
.dark .pt{color:var(--text-secondary)}
.fl{font-size:10.5px;color:var(--text-secondary);margin-bottom:4px;font-weight:500;font-family:var(--font-mono);letter-spacing:.04em}
.sel{width:100%;background:var(--bg-primary);border:1.5px solid var(--border-primary);border-radius:7px;padding:6px 10px;font-size:12px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;appearance:none;cursor:pointer;color:var(--text-primary);font-weight:500;transition:border-color .15s;margin-bottom:0}
.sel:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,122,122,.12)}
.sel.bl{color:var(--accent)}.sel.gr{color:var(--success)}
.inp{width:100%;background:var(--bg-primary);border:1.5px solid var(--border-primary);border-radius:7px;padding:6px 10px;color:var(--text-primary);font-size:12px;font-family:var(--font-mono);outline:none;margin-bottom:8px;transition:border-color .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,122,122,.12)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:3px 9px;border-radius:5px;border:1.5px solid;font-size:10px;cursor:pointer;font-family:var(--font-mono);letter-spacing:.03em;transition:all .12s;background:transparent;font-weight:500}
.pi{font-family:var(--font-mono);font-size:10px;padding:5px 8px;border-radius:5px;margin-bottom:3px;line-height:1.55;word-break:break-all}
.pd{background:var(--success-bg);border:1.5px solid var(--success-border);color:var(--success)}
.pb{background:var(--danger-bg);border:1.5px solid var(--danger-border);color:var(--danger)}
.as{font-family:var(--font-mono);font-size:11px;padding:7px 10px;border-radius:7px;margin-bottom:5px;background:var(--accent-light);border:1.5px solid var(--accent-border);color:var(--accent-dark)}
.dark .as{color:var(--accent-hi)}
.an{font-family:var(--font-mono);font-size:11px;padding:7px 10px;border-radius:7px;background:var(--success-bg);border:1.5px solid var(--success-border);color:var(--success)}
.ai{font-size:11px;padding:7px 10px;border-radius:7px;background:var(--danger-bg);border:1.5px solid var(--danger-border);color:var(--danger)}
.mn{font-size:10px;color:var(--text-muted);margin-bottom:10px;font-family:var(--font-mono)}
.leg{padding:10px 16px;border-top:1px solid var(--border-secondary);display:flex;flex-wrap:wrap;gap:8px;flex-shrink:0}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-secondary);font-family:var(--font-mono)}
.ld{width:8px;height:8px;border-radius:50%}
.gen-btn{margin:14px 16px 2px;padding:10px 0;border-radius:8px;border:none;background:var(--ink-soft);color:var(--bg-secondary);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;font-family:var(--font-mono);transition:background .15s;width:calc(100% - 32px)}
.dark .gen-btn{background:var(--accent);color:var(--ink)}
.gen-btn:hover{background:var(--ink)}
.dark .gen-btn:hover{background:var(--accent-hi)}
.gen-btn:hover{opacity:.9}.gen-btn:disabled{opacity:.5;cursor:default}
.exp-btn{padding:7px 14px;border-radius:7px;border:1.5px solid var(--border-primary);background:var(--bg-secondary);color:var(--text-primary);font-size:11px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:all .12s}
.exp-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.mbg{position:fixed;inset:0;background:rgba(5,6,8,.35);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px)}
.dark .mbg{background:rgba(0,0,0,.55)}
.mo{background:var(--bg-secondary);border:1.5px solid var(--border-primary);border-radius:14px;padding:22px;width:290px;box-shadow:0 20px 50px rgba(5,6,8,.15)}
.dark .mo{box-shadow:0 20px 50px rgba(0,0,0,.4)}
.mh{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:14px;letter-spacing:-.01em}
.mac{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.bc{padding:7px 16px;border-radius:8px;border:1.5px solid var(--border-primary);background:transparent;color:var(--text-secondary);cursor:pointer;font-size:12px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;transition:all .12s}
.bc:hover{border-color:var(--text-muted);color:var(--text-primary)}
.ba{padding:7px 18px;border-radius:8px;border:none;background:var(--ink-soft);color:var(--bg-secondary);cursor:pointer;font-size:11px;font-family:var(--font-mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;transition:background .15s}
.dark .ba{background:var(--accent);color:var(--ink)}
.ba:hover{background:var(--ink)}
.dark .ba:hover{background:var(--accent-hi)}
.lib{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;padding:28px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;align-items:start;background:var(--bg-primary)}
.lib-card{background:var(--bg-secondary);border:1.5px solid var(--border-primary);border-radius:14px;display:flex;flex-direction:column;cursor:default;transition:box-shadow .15s,border-color .15s}
.lib-card:hover{box-shadow:var(--shadow-md);border-color:var(--text-muted)}
.lib-card-head{padding:18px 18px 12px}
.lib-tag{display:inline-block;font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:3px;margin-bottom:10px;font-family:var(--font-mono)}
.lib-name{font-size:19px;font-weight:600;color:var(--text-primary);margin-bottom:10px;line-height:1.3;letter-spacing:-.01em}
.lib-desc{font-size:14px;color:var(--text-secondary);line-height:1.65;margin-bottom:0}
.lib-refs{padding:0 18px 8px}
.lib-load{display:block;width:100%;padding:12px 0;background:transparent;border:none;border-top:1px solid var(--border-primary);font-size:12px;font-weight:500;color:var(--text-primary);cursor:pointer;font-family:var(--font-mono);letter-spacing:.12em;text-transform:uppercase;transition:background .12s,color .15s;margin-top:auto}
.lib-load:hover{background:var(--bg-tertiary);color:var(--accent-dark)}
.dark .lib-load:hover{color:var(--accent-hi)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-primary);border-radius:4px}
svg text{user-select:none;pointer-events:none}

/* ─── Animations ─── */
@keyframes spin-anim{to{transform:rotate(360deg)}}
@keyframes glass-shimmer{0%,100%{transform:translateX(-50%)}50%{transform:translateX(50%)}}
@keyframes path-flow{0%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}
@keyframes path-flow-reverse{0%{stroke-dashoffset:0}100%{stroke-dashoffset:24}}
.spin{display:inline-block;animation:spin-anim 1s linear infinite}
.path-animated{animation:path-flow .6s linear infinite}
.path-animated-reverse{animation:path-flow-reverse .6s linear infinite}

/* ─── Empty State ─── */
.empty-state{position:absolute;top:calc(50% - 70px);left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:320px}
.empty-state-title{font-size:18px;font-weight:600;color:var(--text-primary);letter-spacing:-.01em}
.empty-state-desc{font-size:13px;color:var(--text-secondary);line-height:1.6}
.empty-state-btn{padding:12px 28px;border-radius:8px;border:none;background:var(--ink-soft);color:var(--bg-secondary);font-size:11px;font-family:var(--font-mono);font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .2s,transform .2s}
.dark .empty-state-btn{background:var(--accent);color:var(--ink)}
.empty-state-btn:hover{background:var(--ink);transform:translateY(-1px)}
.dark .empty-state-btn:hover{background:var(--accent-hi)}

.fab-container{position:absolute;top:16px;left:16px;z-index:50;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.fab-label{font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px;margin-left:4px;font-family:var(--font-mono)}
.fab-row{display:flex;align-items:center;gap:6px}
.fab-main{width:42px;height:42px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--ink-soft);color:var(--bg-secondary);box-shadow:0 4px 14px rgba(5,6,8,.2);transition:all .25s cubic-bezier(.4,0,.2,1)}
.dark .fab-main{background:var(--accent);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.fab-main:hover{transform:scale(1.04);background:var(--ink)}
.dark .fab-main:hover{background:var(--accent-hi)}
.fab-main svg{width:20px;height:20px;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.fab-main.open svg{transform:rotate(45deg)}
.fab-tools{display:flex;align-items:center;gap:6px;opacity:0;transform:translateX(-10px);pointer-events:none;transition:all .25s cubic-bezier(.4,0,.2,1)}
.fab-tools.open{opacity:1;transform:translateX(0);pointer-events:auto}
.fab-tool{width:38px;height:38px;border-radius:9px;border:1px solid var(--border-primary);background:var(--bg-secondary);backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);box-shadow:var(--shadow-sm);transition:all .15s}
.fab-tool svg{width:18px;height:18px}
.fab-tool:hover{background:var(--accent-light);color:var(--accent-dark);border-color:var(--accent-border)}
.dark .fab-tool:hover{color:var(--accent-hi)}
.fab-tool.on{background:var(--accent-light);color:var(--accent-dark);border-color:var(--accent);box-shadow:0 0 0 2px rgba(61,122,122,.15)}
.dark .fab-tool.on{color:var(--accent-hi);box-shadow:0 0 0 2px rgba(90,173,173,.2)}
.fab-tool.era{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
.fab-tool.era:hover{background:var(--danger-bg);opacity:.85}
.mob-panel-btn{display:none}
.mob-ai-btn{display:none}
.cn-close-mob{display:none}
.cn-backdrop{display:none}
.pn-close-mob{display:none}

/* ─── Desktop readability bumps (>1024px only) ─── */
@media(min-width:1025px){
  .stats-item{font-size:12px}
  /* Right panel controls — bumped for readability */
  .pn{width:330px}
  .ps{padding:16px 18px}
  .sh-label{font-size:13px !important;letter-spacing:.14em !important}
  .sh-caret{font-size:14px !important}
  /* Bump inline fontSize within rich-text panel sections (Adjustment
     Guidance body + Model Assumptions box). Attribute-selector matches
     React-serialized `style="font-size:Npx"` — both spaced and unspaced. */
  .panel-rich-text [style*="font-size:9px"],
  .panel-rich-text [style*="font-size: 9px"]{font-size:11px !important}
  .panel-rich-text [style*="font-size:10px"],
  .panel-rich-text [style*="font-size: 10px"]{font-size:12px !important}
  .panel-rich-text [style*="font-size:10.5px"],
  .panel-rich-text [style*="font-size: 10.5px"]{font-size:12.5px !important}
  .panel-rich-text [style*="font-size:11px"],
  .panel-rich-text [style*="font-size: 11px"]{font-size:13px !important}
  .panel-rich-text [style*="font-size:12px"],
  .panel-rich-text [style*="font-size: 12px"]{font-size:14px !important}
  /* Canvas legend — the small swatches at the bottom-left */
  .canvas-legend{padding:8px 14px !important;gap:14px !important}
  .canvas-legend .legend-item{font-size:12px !important;gap:6px !important}
  .canvas-legend .legend-item > div:first-child{width:10px !important;height:10px !important}
  .canvas-legend .legend-item svg{width:18px !important;height:8px !important}
  .pt{font-size:13px;letter-spacing:.14em;margin-bottom:12px}
  .fl{font-size:13px;margin-bottom:5px}
  .sel{font-size:15px;padding:8px 12px;border-radius:8px}
  .inp{font-size:15px;padding:8px 12px;border-radius:8px}
  .chip{font-size:13px;padding:5px 11px;border-radius:6px}
  .pi{font-size:13px;padding:7px 10px;line-height:1.6}
  .as{font-size:14px;padding:9px 12px;border-radius:8px}
  .an{font-size:14px;padding:9px 12px;border-radius:8px}
  .ai{font-size:14px;padding:9px 12px;border-radius:8px}
  .mn{font-size:13px;margin-bottom:12px}
  .leg{padding:12px 18px}
  .li{font-size:12.5px}
  .gen-btn{font-size:13.5px;padding:13px 0;letter-spacing:.1em}
  .exp-btn{font-size:13.5px;padding:10px 18px;border-radius:8px}
  /* Code console */
  .cn-title{font-size:11.5px}
  .cn-tab{font-size:11px;padding:4px 11px}
  .cn-status{font-size:11px}
  .cn-btn{font-size:11px;padding:6px 12px}
  .cn-output-title{font-size:10.5px;padding:9px 12px 5px}
  .cn-output-body{font-size:12.5px;line-height:1.6;padding:2px 12px 10px}
  .cn-editor textarea{font-size:13.5px;line-height:1.6;padding:14px 16px}
}

/* ─── Mobile Layout (≤1024px OR landscape phones) ─── */
@media(max-width:1024px), (max-width:900px) and (orientation:landscape){
  /* Lock the app shell to the viewport so the on-screen keyboard and the
     dynamic browser toolbar can't scroll the header off-screen and strand the
     panels (they overlay via position:fixed; only inner areas scroll). */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%}
  .root{height:100%}
  .nav{padding:0 12px;height:48px;position:sticky;top:0;z-index:100}
  .nav-brand{font-size:13px;margin-right:10px;flex:0 0 auto}
  /* Tabs scroll horizontally within the header instead of blowing out the
     page width; brand and theme toggle stay pinned either side. */
  .nav-tabs{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav-tabs::-webkit-scrollbar{display:none}
  .nav-tab{padding:0 10px;font-size:11px;height:48px;flex:0 0 auto}
  .nav-proto{display:none}
  .nav-right{margin-left:auto}
  
  
  .studio{flex-direction:column}
  .tb{display:none}
  /* Console becomes an AI-only bottom sheet on mobile; Python/R stay hidden. */
  .cn{display:flex;position:fixed;left:0;right:0;bottom:0;top:auto;z-index:210;flex:none;max-height:80vh;border-radius:16px 16px 0 0;border-top:1.5px solid var(--border-primary);box-shadow:0 -10px 34px rgba(5,6,8,.28)}
  .cn-title{display:none}
  .cn-tab:not(.ai-tab){display:none}
  .cn-header .cn-btn:not(.primary){display:none}
  .cn-body{flex-direction:column}
  .cn-editor{border-right:none;border-bottom:1px solid var(--border-secondary)}
  .cn-editor textarea{min-height:120px}
  .cn-output{flex:0 0 auto;max-height:38vh}
  .mob-ai-btn{display:inline-flex;position:absolute;bottom:64px;right:14px;z-index:201;align-items:center;gap:7px;height:46px;padding:0 16px 0 13px;border:none;border-radius:14px;background:var(--ink-soft);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:.02em;cursor:pointer;box-shadow:0 4px 20px rgba(5,6,8,.25);transition:transform .2s}
  .mob-ai-btn:active{transform:scale(.95)}
  .mob-ai-btn .mob-ai-spark{fill:#c4b5fd;flex:none}
  .cn-close-mob{display:flex;align-items:center;justify-content:center;width:28px;height:28px;margin-left:6px;border:none;border-radius:7px;background:var(--bg-tertiary);color:var(--text-secondary);font-size:18px;line-height:1;cursor:pointer;flex:0 0 auto}
  .cn-header .cn-btn.primary{flex:0 0 auto}
  .cn-status{display:none}
  /* Backdrop starts below the 48px header so the nav stays visible and tappable
     while the AI sheet is open (gives an escape route + context). */
  .cn-backdrop{display:block;position:fixed;top:48px;left:0;right:0;bottom:0;z-index:205;background:rgba(5,6,8,.35);backdrop-filter:blur(1px)}
  /* Obvious close for the analysis panel (was only the far-corner gear). */
  .pn-close-mob{display:flex;align-items:center;justify-content:center;position:absolute;top:6px;right:8px;z-index:6;width:32px;height:32px;border:none;border-radius:8px;background:var(--bg-tertiary);color:var(--text-secondary);font-size:20px;line-height:1;cursor:pointer}
  .mobile-stats{padding-right:48px}

  .fab-container{top:12px;left:12px}
  .fab-label{display:none}
  .fab-main{width:40px;height:40px;border-radius:12px}
  .fab-main svg{width:18px;height:18px}
  .fab-tool{width:36px;height:36px;border-radius:10px}
  .fab-tool svg{width:16px;height:16px}
  
  .cv{flex:1;min-height:40vh}
  .sb{display:none}
  
  .pn{position:absolute;bottom:0;left:0;right:0;width:100%;max-height:75vh;border-left:none;border-top:2px solid var(--border-primary);border-radius:16px 16px 0 0;box-shadow:0 -8px 32px rgba(5,6,8,.1);z-index:200;transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  .pn.open{transform:translateY(0)}
  .pn::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:36px;height:4px;background:var(--border-primary);border-radius:2px}
  .pn-scroll{-webkit-overflow-scrolling:touch;padding-top:8px}

  .mob-panel-btn{display:flex;position:absolute;top:12px;right:12px;z-index:201;width:48px;height:48px;border-radius:14px;background:var(--ink-soft);color:var(--bg-secondary);border:none;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(5,6,8,.25);cursor:pointer;font-size:18px;transition:all .2s;font-weight:600}
  .mob-panel-btn:active{transform:scale(0.95)}
  .mob-panel-btn.open{background:var(--accent);border-radius:50%}
  .mob-panel-btn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 2px 6px rgba(185,74,74,.35)}
  .mob-panel-btn .badge.success{background:var(--success)}
  
  .ps{padding:12px 14px}
  .pt{font-size:9px;margin-bottom:8px}
  .fl{font-size:10px}
  .sel,.inp{font-size:16px;padding:10px 12px;border-radius:8px}
  .chips{gap:6px}
  .chip{padding:6px 12px;font-size:11px;border-radius:6px}
  
  .gen-btn{padding:14px 0;font-size:14px;border-radius:10px;margin:12px 14px}
  .exp-btn{padding:12px 16px;font-size:12px;border-radius:8px}
  
  .lib{grid-template-columns:1fr!important;padding:16px!important;gap:14px!important}
  .lib-card-head{padding:14px 14px 10px}
  .lib-name{font-size:15px}
  .lib-desc{font-size:12px;line-height:1.6}
  .lib-load{padding:14px 0;font-size:13px}
  
  .mbg{padding:12px!important;align-items:flex-end}
  .mo{width:100%;max-width:none;border-radius:16px 16px 0 0;padding:20px;margin-bottom:0}
  .mh{font-size:16px}
}

/* ─── Small Phone (≤480px) ─── */
@media(max-width:480px){

  .fl{font-size:9px}
  .sel,.inp{font-size:16px;padding:12px 14px}

  .gen-btn{padding:16px 0;font-size:15px;margin:10px 12px}
  .exp-btn{padding:14px 18px;font-size:13px}
  
  .lib{padding:12px!important;gap:12px!important}
  .lib-card{border-radius:12px}
  .lib-card-head{padding:12px 12px 8px}
  .lib-tag{font-size:8px;padding:3px 6px}
  .lib-name{font-size:14px}
  .lib-desc{font-size:11px}
  .lib-load{padding:12px 0;font-size:12px}
  
  .mo{padding:16px;border-radius:14px 14px 0 0}
  .mh{font-size:15px;margin-bottom:12px}
  .mac{gap:6px}
  .bc,.ba{padding:12px 16px;font-size:13px}
}

/* ─── Very Small Phone (≤360px) ─── */
@media(max-width:360px){
  .nav{height:40px;padding:0 8px}
  .nav-brand{font-size:10px}
  .nav-tab{padding:0 5px;font-size:8px;height:40px}
  
  .fab-main{width:32px;height:32px}
  .fab-tool{width:28px;height:28px}
  
  .pn{max-height:85vh}
  .mob-panel-btn{width:40px;height:40px;top:6px;right:6px;border-radius:10px}
  
  .sel,.inp{font-size:16px}
  .chip{padding:6px 10px;font-size:10px}

/* ─── Landscape Phone (any orientation landscape with limited height) ─── */
@media(orientation:landscape) and (max-height:500px){
  .nav{height:36px}
  .nav-tab{height:36px;font-size:9px}
  .nav-brand{font-size:11px}
  .pn{max-height:55vh}
  .mob-panel-btn{width:36px;height:36px;top:8px;right:8px;font-size:14px;border-radius:10px}

  .fab-tool{width:28px;height:28px}

  .canvas-legend{bottom:36px!important;padding:3px 6px!important;gap:3px!important;cursor:pointer}
  .canvas-legend .legend-item span{display:none}
}

/* ─── Touch-friendly improvements ─── */
@media(hover:none) and (pointer:coarse){
  .fab-tool:hover,.fab-main:hover,.exp-btn:hover,.gen-btn:hover,.lib-load:hover,.chip:hover,.nav-tab:hover{
    transform:none;box-shadow:inherit
  }
  .fab-tool:active,.fab-main:active{transform:scale(0.95)}
  .exp-btn:active,.gen-btn:active,.lib-load:active,.chip:active{opacity:0.7}
}

/* ─── Canvas Controls ─── */
.canvas-controls{transition:all .2s}
.canvas-legend{transition:all .2s}
.cv-btn{transition:all .15s}
.cv-btn:active{transform:scale(0.95);opacity:0.8}

@media(max-width:1024px), (max-width:900px) and (orientation:landscape){
  .canvas-controls{top:auto!important;bottom:12px!important;left:10px!important;right:10px!important;gap:6px!important}
  .canvas-controls .cv-btn{padding:8px 10px!important;font-size:9px!important;border-radius:6px!important}
  .canvas-legend{bottom:48px!important;left:10px!important;right:auto!important;max-width:calc(100vw - 80px);padding:5px 10px!important;gap:8px!important;border-radius:6px!important;cursor:pointer}
  .canvas-legend .legend-item{font-size:8px!important;gap:3px!important}
  .canvas-legend .legend-item span{display:none}
  .canvas-legend.collapsed{padding:6px 8px!important;gap:4px!important}
  .canvas-legend.collapsed .legend-item{gap:2px!important}
}
@media(max-width:480px){
  .canvas-controls{bottom:10px!important;left:8px!important;right:8px!important}
  .canvas-controls .cv-btn{padding:10px 8px!important;font-size:9px!important}
  .canvas-legend{bottom:44px!important;left:8px!important;padding:4px 8px!important;gap:6px!important;cursor:pointer}

}
@media(max-width:360px){
  .canvas-controls .cv-btn{padding:8px 6px!important;font-size:8px!important}
  .canvas-legend{bottom:40px!important;left:6px!important;padding:4px 6px!important;gap:4px!important}
  .canvas-legend.collapsed{padding:4px 5px!important}
}
.legend-expand-hint{display:none;font-size:8px;color:var(--text-muted);margin-left:2px}
@media(max-width:1024px){.legend-expand-hint{display:inline}}
.legend-modal{position:fixed;inset:0;background:rgba(5,6,8,.3);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(3px)}
.dark .legend-modal{background:rgba(0,0,0,.5)}
.legend-modal-content{background:var(--bg-secondary);border:1.5px solid var(--border-primary);border-radius:14px;padding:20px;min-width:200px;max-width:90vw;box-shadow:0 20px 50px rgba(5,6,8,.16)}
.dark .legend-modal-content{box-shadow:0 20px 50px rgba(0,0,0,.4)}
.legend-modal-title{font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.legend-modal-close{background:none;border:none;font-size:20px;color:var(--text-muted);cursor:pointer;padding:0 4px;line-height:1}
.legend-modal-items{display:flex;flex-direction:column;gap:10px}
.legend-modal-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary)}

/* ─── Validation View Responsive ─── */
@media(max-width:1024px), (max-width:900px) and (orientation:landscape){
  .validation-container{padding:16px 0!important}
  .validation-inner{padding:0 16px!important;max-width:none!important}

@media(max-width:480px){

@media(max-width:1024px), (max-width:900px) and (orientation:landscape){

}

}

/* ─── Safe area padding for notched phones ─── */
@supports(padding: max(0px)){
  @media(max-width:1024px){
    .nav{padding-left:max(12px, env(safe-area-inset-left));padding-right:max(12px, env(safe-area-inset-right))}

    .mob-panel-btn{top:max(12px, env(safe-area-inset-top))}

    .canvas-legend{bottom:calc(48px + env(safe-area-inset-bottom))!important}
  }
}
</style>

<body>

const buildDagPrompt = (question) => `You are a causal-inference assistant embedded in DAG Studio. Your ONLY task is to translate the researcher's question into a causal directed acyclic graph (DAG) in dagitty syntax.

STRICT RULES:
- Stay faithful to the research question. Do not invent an exposure or outcome that was not asked about.
- Tag the primary exposure with [exposure] and the primary outcome with [outcome].
- Add only variables that are causally justified for THIS question: established confounders, mediators on the causal path, and relevant colliders. Prefer well-established domain variables over speculation.
- Every variable you declare MUST participate in at least one directed edge. Never output an isolated node with no arrows.
- If the question names variables the researchers adjusted for, controlled for, matched on, or "accounted for", include EACH one and connect it by its causal role. Default each to a confounder, drawing an edge from it into BOTH the exposure and the outcome, unless it is clearly a mediator (it lies on the exposure->outcome path) or a collider (a shared effect of the exposure and the outcome). Draw the causal structure, not the analysis plan: represent what causes what, and let the identification tooling decide what to adjust for. Do not drop any named variable and do not leave any unconnected. For example, for "the effect of X on Y, accounting for A, B, and C", emit A -> X, A -> Y, B -> X, B -> Y, C -> X, C -> Y (unless one is genuinely a mediator or collider); never leave A, B, or C as a bare declaration.
- Use short, readable node labels (letters, digits, spaces only). Draw directed edges with -> only.
- Do NOT simulate data, cite literature, fetch anything, or add commentary inside the graph.

OUTPUT EXACTLY these two parts and nothing else:
1) A fenced code block labelled dagitty with a single graph, for example:
\`\`\`dagitty
dag {
  Smoking [exposure]
  LungCancer [outcome]
  Age
  Smoking -> LungCancer
  Age -> Smoking
  Age -> LungCancer
}
\`\`\`
2) After the block, one line starting "CONFOUNDERS:" listing up to 5 additional potential confounders NOT already in the DAG that the researcher might consider (comma-separated), or "CONFOUNDERS: none".

Research question: ${question}`;

// Pull the dagitty graph out of the reply, tolerant of fencing or its absence.
const extractDagitty = (text) => {
  if (!text) return '';
  const fenced = text.match(/```(?:dagitty|r)?\s*([\s\S]*?)```/i);
  const body = fenced ? fenced[1] : text;
  const dm = body.match(/dag\s*\{[\s\S]*\}/i);
  return dm ? dm[0].trim() : body.trim();
};

// Pull the "CONFOUNDERS:" suggestion line, if the model included one.
const extractConfounders = (text) => {
  const m = text && text.match(/CONFOUNDERS:\s*(.+?)\s*$/im);
  const v = m ? m[1].trim() : '';
  return (!v || /^none\.?$/i.test(v)) ? '' : v;
};

// Aesthetic layout for AI-generated DAGs: exposure and outcome sit on a shared
// horizontal axis (exposure left, outcome right), and every other variable is
// arranged in an elliptical halo around them — split between an upper and lower
// arc and kept clear of the horizontal poles so nothing collides with the
// exposure/outcome pair. Returns { id: {x, y} } in canvas units; the caller
// (reconcileDagFromCode) re-centers the whole set on the canvas, so only the
// relative geometry matters here.
const radialCausalLayout = (nodeList, exposureId, outcomeId) => {
  const pos = {};
  const others = nodeList.filter(n => n.id !== exposureId && n.id !== outcomeId);
  const m = others.length;
  const gap = 220;                                   // target spacing between halo nodes
  const R = Math.max(260, (gap * m) / (2 * Math.PI));
  const rx = R * 1.35, ry = R * 0.95;                // ellipse: a little wider than tall
  const span = Math.min(230, rx * 0.55);             // exposure/outcome offset from center
  if (exposureId) pos[exposureId] = { x: -span, y: 0 };
  if (outcomeId)  pos[outcomeId]  = { x:  span, y: 0 };
  const margin = 0.42;                               // radians kept clear of the poles (~24°)
  const top = Math.ceil(m / 2);
  const placeArc = (arr, base) => {
    const a = arr.length;
    for (let j = 0; j < a; j++) {
      const t = a === 1 ? 0.5 : (j + 0.5) / a;
      const theta = base + margin + t * (Math.PI - 2 * margin);
      pos[arr[j].id] = { x: rx * Math.cos(theta), y: ry * Math.sin(theta) };
    }
  };
  placeArc(others.slice(0, top), 0);                 // upper arc
  placeArc(others.slice(top), Math.PI);              // lower arc
  return pos;
};

// Compute x/y for every node. Preserves positions for ids in `preserved`;
// everything else gets a simple left-to-right layered placement.
function simpleDagLayout(allNodes, allEdges, preserved) {
  if (!allNodes || allNodes.length === 0) return {};
  // Dagre handles layering, crossing minimization (including dummy nodes for
  // long edges that skip layers), and balanced ranks. Returns center coords
  // for each node, which matches DAG Studio's render model. Downstream
  // reconcileDagFromCode shifts the bbox to the viewport center.
  const g = new dagre.graphlib.Graph();
  g.setGraph({
    rankdir: 'LR',
    nodesep: 80,
    ranksep: 140,
    marginx: 40,
    marginy: 40,
  });
  g.setDefaultEdgeLabel(() => ({}));
  const idSet = new Set(allNodes.map(n => n.id));
  for (const n of allNodes) {
    const label = String(n.label || n.id);
    g.setNode(n.id, { width: Math.max(80, label.length * 8 + 32), height: 38 });
  }
  for (const e of allEdges || []) {
    if (idSet.has(e.src) && idSet.has(e.tgt)) g.setEdge(e.src, e.tgt);

  dagre.layout(g);
  const result = {};
  for (const n of allNodes) {
    if (preserved && preserved.has(n.id)) {
      result[n.id] = preserved.get(n.id);
    } else {
      const dn = g.node(n.id);
      result[n.id] = { x: dn.x, y: dn.y };
    }

    // setExposure/setOutcome logic below), then auto-classify the rest so the
    // right-panel labels populate the same way they do on hand-built DAGs.
    const effExposure = (dag.exposure && newIds.has(dag.exposure)) ? dag.exposure
      : (newIds.has(exposure) ? exposure : (newNodeList[0] ? newNodeList[0].id : null));
    const effOutcome = (dag.outcome && newIds.has(dag.outcome)) ? dag.outcome
      : (newIds.has(outcome) ? outcome : (newNodeList[newNodeList.length - 1] ? newNodeList[newNodeList.length - 1].id : null));
    const fwd = {}, rev = {};
    for (const e of newEdgeList) {
      (fwd[e.src] = fwd[e.src] || []).push(e.tgt);
      (rev[e.tgt] = rev[e.tgt] || []).push(e.src);
    }
    const reachableFrom = (start, adj) => {
      const seen = new Set();
      if (!start) return seen;
      const q = [start];
      while (q.length) {
        const c = q.shift();
        for (const nb of (adj[c] || [])) {
          if (!seen.has(nb)) { seen.add(nb); q.push(nb); }
        }
      }
      return seen;
    };
    const descOfExp = reachableFrom(effExposure, fwd);
    const descOfOut = reachableFrom(effOutcome, fwd);
    const ancOfExp  = reachableFrom(effExposure, rev);
    const ancOfOut  = reachableFrom(effOutcome,  rev);
    const classifyStructural = (id) => {
      if (id === effExposure || id === effOutcome) return null;
      if (descOfExp.has(id) && ancOfOut.has(id)) return 'mediator';
      if (ancOfExp.has(id) && ancOfOut.has(id)) return 'confounder';
      if (descOfExp.has(id) && descOfOut.has(id)) return 'collider';
      return null;
    };

    const nextNodes = newNodeList.map(n => {
      const ex = matchFor[n.id];
      const pos = (customPositions && customPositions[n.id]) || positions[n.id] || { x: 200, y: 200 };
      const roleFromCode = (n.role && roleAllowed.has(n.role)) ? n.role : null;
      const matchedType = ex ? ex.type : null;
      const structural = (!roleFromCode && !matchedType) ? classifyStructural(n.id) : null;
      return {
        id: n.id,
        label: n.label || n.id,
        x: pos.x,
        y: pos.y,
        type: roleFromCode || matchedType || structural || 'variable'
      };
    });
    const nextEdges = newEdgeList
      .filter(e => newIds.has(e.src) && newIds.has(e.tgt))
      .map((e, i) => ({ id: `e${i + 1}`, src: e.src, tgt: e.tgt, bend: 0 }));

    // Center on canvas. Mirrors the first-mount bbox-centering math (with
    // bottomReserve for legend / canvas controls / status bar) so imports
    // land centered regardless of viewport size. Skipped if the svg isn't
    // mounted yet; the first-mount useEffect handles that case.
    if (svgRef.current && nextNodes.length) {
      const r = svgRef.current.getBoundingClientRect();
      if (r.width && r.height) {
        const charW = 8, padX = 16, minW = 80;
        const bottomReserve = 80;
        const xs = nextNodes.flatMap(n => {
          const hw = Math.max(minW, String(n.label || n.id).length * charW + padX * 2) / 2;
          return [n.x - hw, n.x + hw];
        });
        const ys = nextNodes.flatMap(n => [n.y - 19, n.y + 19]);
        const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
        const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
        const dx = r.width / 2 - cx;
        const dy = (r.height - bottomReserve) / 2 - cy;
        for (const n of nextNodes) { n.x += dx; n.y += dy; }
      }
    }

    snapshot();
    lastRunSourceRef.current = appliedLang || 'code';
    _setNodes(nextNodes);
    _setEdges(nextEdges);
    _setModifiers([]);
    setSelected(null);
    setEdgeSrc(null);
    setModifierSrc(null);
    setLoadedLibraryId('');
    if (dag.exposure && newIds.has(dag.exposure)) setExposure(dag.exposure);
    else if (!newIds.has(exposure)) setExposure(nextNodes[0] ? nextNodes[0].id : '');
    if (dag.outcome && newIds.has(dag.outcome)) setOutcome(dag.outcome);
    else if (!newIds.has(outcome)) setOutcome(nextNodes[nextNodes.length - 1] ? nextNodes[nextNodes.length - 1].id : '');
    return { applied: true, nodes: nextNodes.length, edges: nextEdges.length, nodeList: nextNodes };
  };

  // Build (or reuse) the Python worker. Worker source is an IIFE built from
  // _pyWorkerFn so the embedded Python stays readable in the parent script.
  const getPyWorker = () => {
    if (pyWorkerRef.current) return pyWorkerRef.current;
    const src = '(' + _pyWorkerFn.toString() + ')();';
    const blob = new Blob([src], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    const worker = new Worker(url);
    worker.onmessage = (ev) => {
      const d = ev.data || {};
      if (d.type === 'status') {
        setRuntimeStatus(s => ({ ...s, python: d.status }));
        if (d.status === 'loading') {
          setConsoleOutput('Downloading Python runtime (~10 MB, first load only)…');
          setConsoleErr(false);
        } else if (d.status === 'ready') {
          // Leave output alone; run handler shows the real output next.
        } else if (d.status === 'err') {
          setConsoleErr(true);
          setConsoleOutput('Python runtime failed to load: ' + (d.note || 'unknown error'));
        }
      } else if (d.type === 'result') {
        setRuntimeBusy(false);
        const parts = [];
        if (d.stdout) parts.push(d.stdout.trimEnd());
        if (d.status === 'ok' && d.dag) {
          const res = reconcileDagFromCode(d.dag, 'python');
          if (res.applied) parts.push(`Applied ${res.nodes} nodes and ${res.edges} edges to canvas. Canvas modifiers cleared.`);
        } else if (d.stderr) {
          parts.push(d.stderr.trimEnd());
        }
        setConsoleErr(d.status !== 'ok');
        setConsoleOutput(parts.join('\n') || (d.status === 'ok' ? 'Done.' : 'Error.'));
      }
    };
    worker.onerror = (e) => {
      setRuntimeBusy(false);
      setRuntimeStatus(s => ({ ...s, python: 'err' }));
      setConsoleErr(true);
      setConsoleOutput('Python worker error: ' + (e.message || 'unknown'));
    };
    pyWorkerRef.current = worker;
    worker.postMessage({ type: 'init' });
    return worker;
  };

  const runConsole = async () => {
    setConsoleErr(false);
    const code = consoleCode[consoleLang] || '';
    if (consoleLang === 'ai') {
      const question = code.trim();
      if (!question) {
        setConsoleOutput('Enter a research question, then click Generate DAG.');
        return;
      }
      if (!aiEnabled()) {
        setConsoleErr(true);
        setConsoleOutput('The AI assistant is not configured (no proxy URL set).');
        return;
      }
      setRuntimeBusy(true);
      setConsoleOutput('Thinking… building a causal DAG from your question.');
      try {
        const reply = await callAI(buildDagPrompt(question));
        const dsl = extractDagitty(reply);
        if (!dsl) throw new Error('The assistant did not return a DAG. Try rephrasing the question.');
        // Route through the same parseDagitty + reconcileDagFromCode pipe the R
        // console and URL importer use (wrap raw DSL as the R importer does).
        const dag = parseDagitty(`dagitty('${dsl.replace(/'/g, "\\'")}')`);
        // Deterministic orphan repair. Prompt wording alone does not reliably
        // stop the model from declaring a variable and never connecting it, so
        // any node left with no edges is wired as a confounder (a common cause
        // of both exposure and outcome). This makes the DAG usable as-is; it is
        // a default, not a truth claim, and the identification engine flags any
        // that cause overadjustment. Requires both poles to attach to.
        const connectedIds = () => {
          const s = new Set();
          dag.edges.forEach(e => { s.add(e.src); s.add(e.tgt); });
          return s;
        };
        const autoWired = [];
        if (dag.exposure && dag.outcome) {
          const connected = connectedIds();
          dag.nodes.forEach(n => {
            if (n.id !== dag.exposure && n.id !== dag.outcome && !connected.has(n.id)) {
              dag.edges.push({ src: n.id, tgt: dag.exposure });
              dag.edges.push({ src: n.id, tgt: dag.outcome });
              autoWired.push(n.label || n.id);
            }
          });
        }
        // Anything still unconnected (only when exposure/outcome is missing, so
        // there was nothing to attach it to) is surfaced for manual wiring.
        const stillOrphan = (() => { const c = connectedIds(); return dag.nodes.filter(n => !c.has(n.id)).map(n => n.label || n.id); })();
        // Exposure/outcome on a shared axis, other variables haloed around them.
        const layout = radialCausalLayout(dag.nodes, dag.exposure, dag.outcome);
        const res = reconcileDagFromCode(dag, 'ai', layout);
        if (!res.applied) throw new Error(res.reason || 'Could not apply the generated DAG.');
        // Frame the freshly generated DAG inside the safe area so no node or edge
        // ends up hidden under the controls, legend, status bar, or margins.
        if (res.nodeList) requestAnimationFrame(() => fitToView(res.nodeList));
        const extra = extractConfounders(reply);
        setConsoleErr(false);
        setConsoleOutput(
          `Built ${res.nodes} nodes and ${res.edges} edges from your question.` +
          (autoWired.length ? `\n\nConnected as confounders by default (review whether each is truly a common cause, or instead a mediator or collider): ${autoWired.join(', ')}` : '') +
          (stillOrphan.length ? `\n\nStill unconnected (no exposure/outcome to attach to): ${stillOrphan.join(', ')}` : '') +
          (extra ? `\n\nConfounders worth considering (not added): ${extra}` : '') +
          `\n\nReview every node and arrow. The assistant proposes a starting point, not a verified causal structure.`
        );
        // On mobile, close the sheet so the freshly generated DAG is visible on
        // the canvas (desktop keeps it open for side-by-side editing).
        if (isMobile()) setConsoleOpen(false);
      } catch (err) {
        setConsoleErr(true);
        setConsoleOutput(String((err && err.message) || err));
      } finally {
        setRuntimeBusy(false);
      }
      return;
    }
    if (!code.trim()) {
      setConsoleOutput('No code to run. Build a DAG on the canvas or type code here.');
      return;
    }
    if (consoleLang === 'python') {
      setRuntimeBusy(true);
      setConsoleOutput('Running Python…');
      const w = getPyWorker();
      w.postMessage({ type: 'run', code });
      return;
    }
    if (consoleLang === 'r') {
      // Pure-JS dagitty DSL parser — no WebR, no runtime download.
      try {
        const dag = parseDagitty(code);
        const res = reconcileDagFromCode(dag, 'r');
        setConsoleErr(false);
        setConsoleOutput(
          res.applied
            ? `Applied ${res.nodes} nodes and ${res.edges} edges to canvas. Canvas modifiers cleared.`
            : (res.reason || 'Could not apply DAG.')
        );
      } catch (err) {
        setConsoleErr(true);
        setConsoleOutput(String((err && err.message) || err));
      }
      return;
    }
  };

  // Deep-link load: ?dagitty=… on mount routes through the same
  // parseDagitty + reconcileDagFromCode pathway used by the R console import.
  // Accepts either a raw dagitty DSL ("dag { X [exposure]; Y [outcome]; X -> Y
  // }") or the R-wrapped form ("dagitty('dag { … }')") since callers may
  // produce either. Subsequent edits stay local; the URL is not rewritten as
  // the user edits. Bad input surfaces an alert and leaves the INIT defaults.
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('dagitty');
    if (!raw) return;
    const trimmed = raw.trim();
    const wrapped = /^\s*dagitty\s*\(/.test(trimmed)
      ? trimmed
      : `dagitty('${trimmed.replace(/'/g, "\\'")}')`;
    // Optional &layout= param: base64-encoded JSON of [{id, x, y}, …].
    // Bad input silently falls back to simpleDagLayout (no alert).
    let customPositions;
    const layoutB64 = params.get('layout');
    if (layoutB64) {
      try {
        const json = decodeURIComponent(escape(atob(layoutB64)));
        const arr = JSON.parse(json);
        if (Array.isArray(arr)) {
          const m = {};
          for (const item of arr) {
            if (item && typeof item.id === 'string' && typeof item.x === 'number' && typeof item.y === 'number') {
              m[item.id] = { x: item.x, y: item.y };
            }
          }
          if (Object.keys(m).length > 0) customPositions = m;
        }
      } catch (_) {
        // bad layout: ignore
      }
    }
    try {
      const dag = parseDagitty(wrapped);
      const res = reconcileDagFromCode(dag, 'url', customPositions);
      if (!res.applied) {
        alert('Could not load DAG from URL: ' + (res.reason || 'unknown error'));
      }
    } catch (err) {
      alert('Could not load DAG from URL: ' + ((err && err.message) || err));
    }
  }, []);

  // Canvas → code auto-regen. Debounce so dragging nodes etc. doesn't thrash.
  // If the canvas change came from running code, preserve the source language's
  // editor buffer (don't canonicalize what the user just typed) but still
  // refresh the OTHER language to mirror the new canvas state.
  useEffect(() => {
    const src = lastRunSourceRef.current;
    const t = setTimeout(() => {
      const py = generatePythonCode(nodes, edges, exposure, outcome);
      const r  = generateRCode(nodes, edges, exposure, outcome);
      if (src === 'python')      setConsoleCode(c => ({ ...c, r }));
      else if (src === 'r')      setConsoleCode(c => ({ ...c, python: py }));
      else                       setConsoleCode(c => ({ ...c, python: py, r }));
      lastRunSourceRef.current = 'canvas';
    }, 150);
    return () => clearTimeout(t);
  }, [nodes, edges, exposure, outcome]);

  // Clean up the Python worker on unmount.
  useEffect(() => () => {
    if (pyWorkerRef.current) { try { pyWorkerRef.current.terminate(); } catch (_) {} }
  }, []);
  
  // Apply dark mode class to root
  React.useEffect(() => {
    if (darkMode) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  }, [darkMode]);
  
  // Viewport transform state for pan/zoom
  const [viewTransform, setViewTransform] = useState({ x: 0, y: 0, scale: 1 });
  const [isPanning, setIsPanning] = useState(false);
  const [panStart, setPanStart] = useState({ x: 0, y: 0, vx: 0, vy: 0 });
  
  // Helper to check if on mobile
  const isMobile = () => typeof window !== 'undefined' && window.innerWidth <= 1024;
  
  // Fit the DAG inside a SAFE AREA so no node or edge hides under the floating
  // chrome. Reserved bands (per side) clear: the controls (Fit/Undo/Re-layout/
  // Zoom/Clear) and the legend, plus the status bar and mobile FABs. The DAG is
  // scaled to fit and centered WITHIN that inset rectangle, not the raw canvas.
  const fitToView = useCallback((targetNodes = null) => {
    const nodesToFit = targetNodes || nodes;
    if (!nodesToFit.length || !svgRef.current) return;

    const r = svgRef.current.getBoundingClientRect();
    const W = r.width, H = r.height;
    if (W <= 0 || H <= 0) return;

    // Desktop: controls top-right, legend bottom-right, status bar bottom.
    // Mobile: FABs top, controls + legend bottom (status bar hidden).
    const m = isMobile();
    const insetTop    = m ? 66 : 72;   // top controls / FABs
    const insetBottom = m ? 92 : 88;   // legend + status bar (or mobile controls)
    const insetLeft   = m ? 16 : 28;
    const insetRight  = m ? 16 : 28;

    // Node extents include label width + node height so edges/labels are framed
    // too, not just centers (matches the node-render sizing).
    const charW = 8, padX = 16, minW = 80, halfH = 22;
    const hw = (n) => Math.max(minW, String(n.label || n.id).length * charW + padX * 2) / 2;
    const minX = Math.min(...nodesToFit.map(n => n.x - hw(n)));
    const maxX = Math.max(...nodesToFit.map(n => n.x + hw(n)));
    const minY = Math.min(...nodesToFit.map(n => n.y - halfH));
    const maxY = Math.max(...nodesToFit.map(n => n.y + halfH));

    const dagW = Math.max(1, maxX - minX);
    const dagH = Math.max(1, maxY - minY);
    const dagCx = (minX + maxX) / 2, dagCy = (minY + maxY) / 2;

    const availW = Math.max(1, W - insetLeft - insetRight);
    const availH = Math.max(1, H - insetTop - insetBottom);

    let scale = Math.min(availW / dagW, availH / dagH, 1.2);
    scale = Math.max(0.25, Math.min(scale, 1.5)); // clamp

    // Center of the safe rectangle (not the full canvas).
    const targetCx = insetLeft + availW / 2;
    const targetCy = insetTop + availH / 2;
    const offsetX = targetCx - dagCx * scale;
    const offsetY = targetCy - dagCy * scale;

    setViewTransform({ x: offsetX, y: offsetY, scale });
  }, [nodes]);
  
  // Reset view transform when switching to studio view or loading new DAG
  const resetViewTransform = useCallback(() => {
    setViewTransform({ x: 0, y: 0, scale: 1 });
  }, []);

  // Slider ↔ scale mapping. Piecewise so default zoom (1.0x) sits at 50 on a
  // 0-100 slider: 0-50 spans 0.3x → 1.0x, 50-100 spans 1.0x → 2.5x.
  const ZOOM_MIN = 0.3, ZOOM_MAX = 2.5;
  const scaleToSlider = (s) => {
    const clamped = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, s));
    if (clamped <= 1) return Math.round((clamped - ZOOM_MIN) / (1 - ZOOM_MIN) * 50);
    return Math.round(50 + (clamped - 1) / (ZOOM_MAX - 1) * 50);
  };
  const sliderToScale = (v) => {
    const c = Math.min(100, Math.max(0, v));
    if (c <= 50) return ZOOM_MIN + (c / 50) * (1 - ZOOM_MIN);
    return 1 + ((c - 50) / 50) * (ZOOM_MAX - 1);
  };
  // Apply zoom centered on the visible canvas midpoint.
  const setZoom = useCallback((newScale) => {
    if (!svgRef.current) { setViewTransform(t => ({ ...t, scale: newScale })); return; }
    const rect = svgRef.current.getBoundingClientRect();
    const cx = rect.width / 2, cy = rect.height / 2;
    setViewTransform(t => {
      const change = newScale / (t.scale || 1);
      return {
        x: cx - (cx - t.x) * change,
        y: cy - (cy - t.y) * change,
        scale: newScale
      };
    });
  }, []);
  
  const svgRef = useRef(null);
  React.useEffect(() => {
    const onWinMove = e => onSVGMouseMove(e);
    const onWinUp = () => { setDrag(null); setEdgeBendDrag(null); setIsPanning(false); };
    window.addEventListener('mousemove', onWinMove);
    window.addEventListener('mouseup', onWinUp);
    return () => { window.removeEventListener('mousemove', onWinMove); window.removeEventListener('mouseup', onWinUp); };
  });
  // Center/fit nodes on first mount
  React.useEffect(() => {
    if (!svgRef.current) return;
    const r = svgRef.current.getBoundingClientRect();
    if (!r.width || !r.height) return;
    
    // On mobile, use fitToView for proper scaling
    if (isMobile() && nodes.length > 0) {
      setTimeout(() => fitToView(), 50);
      return;
    }
    
    // On desktop, just center without scaling. Reserve ~140px at the bottom
    // so the DAG clears the legend + canvas-controls + status bar, even when
    // the code console is open and the canvas is shorter than the full page.
    const charW = 8, padX = 16, minW = 80;
    const bottomReserve = 80;
    _setNodes(prev => {
      const xs = prev.flatMap(n => { const hw = Math.max(minW, n.label.length*charW+padX*2)/2; return [n.x-hw, n.x+hw]; });
      const ys = prev.flatMap(n => [n.y-19, n.y+19]);
      const cx = (Math.min(...xs)+Math.max(...xs))/2;
      const cy = (Math.min(...ys)+Math.max(...ys))/2;
      return prev.map(n => ({ ...n, x: n.x - cx + r.width/2, y: n.y - cy + (r.height - bottomReserve)/2 }));
    });
  }, []);
  
  // Handle window resize - refit on mobile
  React.useEffect(() => {
    let resizeTimeout;
    const handleResize = () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (isMobile() && nodes.length > 0 && view === 'studio') {
          fitToView();
        }
      }, 200);
    };
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);
    return () => {
      window.removeEventListener('resize', handleResize);
      window.removeEventListener('orientationchange', handleResize);
      clearTimeout(resizeTimeout);
    };
  }, [nodes, view, fitToView]);
  
  // Key on graph *structure*, not nodes/edges identity: drags, edge bends,
  // and label edits replace the arrays without changing what the engine sees,
  // and used to re-run the analysis per frame and wipe the user's Adjust For
  // selections mid-drag. Types are included because latent nodes are excluded
  // from adjustment candidates.
  const structuralKey = [
    nodes.map(n => n.id + ':' + (n.type || '')).join(','),
    edges.map(e => e.src + '>' + e.tgt).join(','),
    exposure, outcome
  ].join('|');
  useEffect(() => {
    setAnalysis(computeAdjustmentSets(exposure, outcome, nodes, edges));
    setAdjustedZ(new Set());
  }, [structuralKey]);
  // Backdoor-shaped paths (first edge points into the exposure), derived from
  // the already-computed analysis.all instead of re-running allPaths in the
  // render body. Unlike analysis.backdoor, this keeps paths a collider blocks
  // with no adjustment; the path list and Adjust For panels classify those
  // separately from open backdoors.
  const rawBackdoorPaths = React.useMemo(() => {
    if (!analysis || !exposure || !outcome) return [];
    return analysis.all.filter(p => p.length >= 2 && edges.some(e => e.src === p[1] && e.tgt === exposure));
  }, [analysis]);
  // Regression estimates for the Data Simulation panel. Memoized: two OLS
  // fits over up to 10k rows previously re-ran on every render while the
  // panel was open. analysis stands in for graph structure in the deps.
  const regressionStats = React.useMemo(() => {
    if (!simData || !exposure || !outcome) return null;
    const trueResult = computeTrueEffect(exposure, outcome, edges, simData.coefficients || {});
    const crudeBeta = computeOLSCoefficients(simData.data, outcome, [exposure]);
    const Z = Array.from(adjustedZ);
    const adjBeta = Z.length > 0 ? computeOLSCoefficients(simData.data, outcome, [exposure, ...Z]) : null;
    return { trueResult, crudeBeta, adjBeta, Z };
  }, [simData, analysis, adjustedZ]);
  // Per-variable summary stats for the simulated-data preview, memoized on
  // the dataset rather than recomputed per render of the open preview.
  const simSummaryStats = React.useMemo(() => {
    if (!simData) return null;
    return simData.order.map(id => {
      const vals = simData.data.map(r => r[id]);
      const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
      const sd = Math.sqrt(vals.reduce((a, v) => a + (v - mean) ** 2, 0) / vals.length);
      return { id, mean, sd };
    });
  }, [simData]);
  const toggleSection = key => setOpenSections(prev => ({
    ...prev,
    [key]: !prev[key]
  }));
  const svgXY = e => {
    if (!svgRef.current) return { x: 0, y: 0 };
    const r = svgRef.current.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    // Convert screen coordinates to canvas coordinates accounting for transform
    const screenX = src.clientX - r.left;
    const screenY = src.clientY - r.top;
    return {
      x: (screenX - viewTransform.x) / viewTransform.scale,
      y: (screenY - viewTransform.y) / viewTransform.scale
    };
  };
  const onSVGMouseMove = e => {
    const p = svgXY(e);
    // `mouse` only feeds the edge/modifier rubber-band preview; updating it
    // outside those modes re-renders the whole app on every cursor move.
    if ((tool === 'edge' && edgeSrc) || (tool === 'modifier' && modifierSrc)) setMouse(p);
    if (drag) _setNodes(prev => prev.map(n => n.id === drag.id ? {
      ...n,
      x: p.x - drag.ox,
      y: p.y - drag.oy
    } : n));
    if (edgeBendDrag) {
      const {
        id,
        ux,
        uy,
        nmx,
        nmy
      } = edgeBendDrag;
      const bend = -(p.x - nmx) * uy + (p.y - nmy) * ux;
      _setEdges(prev => prev.map(ed => ed.id === id ? {
        ...ed,
        bend: Math.round(bend)
